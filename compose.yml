name: githubprint
services:
  web:
    build:
      context: .
      secrets: [buildenv]
    image: githubprint-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8447:80"
    env_file:
      - path: .env.docker
        required: false
    logging:
      options: { max-size: 10m, max-file: "3" }
secrets:
  buildenv:
    file: .env.docker
